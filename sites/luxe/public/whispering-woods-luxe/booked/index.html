<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3ede4" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Whispering Woods Luxe estate reservation confirmation." />
  <title>Reservation received · Whispering Woods Luxe</title>
  <link rel="icon" href="/heirloom/assets/favicon.png" type="image/png" sizes="512x512" />
  <link rel="apple-touch-icon" href="/heirloom/assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="/heirloom/assets/wwluxe-shared.css" />
</head>
<body class="wwl-confirm-page">
  <main class="wwl-confirm" id="wwl-confirm" aria-live="polite" aria-busy="true">
    <div class="wwl-confirm__skeleton" id="confirm-skeleton" role="status" aria-label="Loading confirmation">
      <div class="wwl-confirm__sk wwl-confirm__sk--tree"></div>
      <div class="wwl-confirm__sk wwl-confirm__sk--eyebrow"></div>
      <div class="wwl-confirm__sk wwl-confirm__sk--title"></div>
      <div class="wwl-confirm__sk wwl-confirm__sk--lede"></div>
      <div class="wwl-confirm__sk-card">
        <div class="wwl-confirm__sk wwl-confirm__sk--line"></div>
        <div class="wwl-confirm__sk wwl-confirm__sk--line wwl-confirm__sk--line-short"></div>
        <div class="wwl-confirm__sk wwl-confirm__sk--line wwl-confirm__sk--line-mid"></div>
      </div>
      <div class="wwl-confirm__sk wwl-confirm__sk--btn"></div>
    </div>

    <div class="wwl-confirm__content wwl-confirm__content--pending" id="confirm-content" hidden>
      <div class="wwl-confirm__tree-wrap" aria-hidden="true">
        <img class="wwl-confirm__tree" src="/heirloom/assets/heirloom-splash-tree.svg" width="179" height="179" alt="" />
      </div>

      <p class="wwl-confirm__eyebrow" id="confirm-eyebrow">Whispering Woods Luxe</p>
      <h1 class="wwl-confirm__title" id="confirm-title">Payment received</h1>
      <p class="wwl-confirm__lede" id="confirm-lede">Your estate reservation is confirmed.</p>

      <div class="wwl-confirm__card">
        <p class="wwl-confirm__body" id="confirm-body">
          Stripe will email your receipt. Our studio will be sending your estate day details. We can't wait to welcome you to the grounds.
        </p>
        <p class="wwl-confirm__ref wwl-hidden" id="confirm-ref" hidden></p>
      </div>

      <a class="wwl-btn wwl-btn--gold wwl-confirm__home" id="confirm-home" href="https://whisperingwoodsluxe.com/">Return to the estate site</a>
    </div>
  </main>

  <script>
    (function () {
      var MIN_SKELETON_MS = 500;
      var loadStarted = Date.now();

      var q = new URLSearchParams(window.location.search);
      var ref = (q.get("ref") || "").trim();
      var cancelled =
        q.get("cancelled") === "1" ||
        q.get("booked") === "0" ||
        q.get("balance_paid") === "0";
      var balanceOk = q.get("balance_paid") === "1";

      var skeleton = document.getElementById("confirm-skeleton");
      var content = document.getElementById("confirm-content");
      var title = document.getElementById("confirm-title");
      var lede = document.getElementById("confirm-lede");
      var body = document.getElementById("confirm-body");
      var refEl = document.getElementById("confirm-ref");
      var eyebrow = document.getElementById("confirm-eyebrow");

      if (cancelled) {
        document.title = "Checkout paused · Whispering Woods Luxe";
        title.textContent = "Checkout paused";
        lede.textContent = "Your spot is not reserved yet.";
        body.textContent =
          "You left before payment finished. When you are ready, open Secure my spot again from the estate site. We will walk you through the same calm checkout.";
        eyebrow.textContent = "Whispering Woods Luxe";
      } else if (balanceOk) {
        title.textContent = "Balance received";
        lede.textContent = "Your estate experience is paid in full.";
        body.textContent =
          "Stripe will email your receipt. Our studio will be sending your estate day details. We can't wait to welcome you to the grounds.";
      }

      if (ref) {
        refEl.textContent = "Reference · " + ref;
        refEl.hidden = false;
        refEl.classList.remove("wwl-hidden");
      }

      function revealContent() {
        var wait = Math.max(0, MIN_SKELETON_MS - (Date.now() - loadStarted));
        window.setTimeout(function () {
          var main = document.getElementById("wwl-confirm");
          if (main) main.removeAttribute("aria-busy");
          skeleton.classList.add("is-out");
          skeleton.setAttribute("aria-hidden", "true");
          content.hidden = false;
          content.classList.remove("wwl-confirm__content--pending");
          content.classList.add("wwl-confirm__content--ready");
        }, wait);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", revealContent);
      } else {
        revealContent();
      }
    })();
  </script>
</body>
</html>
